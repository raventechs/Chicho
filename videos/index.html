<!--
  ARCHIVO: videos/index.html
  VERSIÓN: v1.0
  FECHA: 14/11/2026
  PROYECTO: RavenTechs — Página de videos de venta (se manda por WhatsApp desde la app de vendedores)
  CHANGELOG:
  - v1.0 (14/11/2026): reproductor para ?app=<id>&v=basica|completa&ref=<código>. Alterna Básica/Completa, botón de prueba gratis (reenvía el código del vendedor a /probar/) y WhatsApp. Los videos están en /videos/RavenTechs-<rubro>-<basica|completa>.mp4.
  PENDIENTE:
  - Si se suma una app nueva con video: agregar su id en APPS y subir los 2 mp4
-->
<!DOCTYPE html>
<html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Mirá cómo funciona — RavenTechs</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--c:#f0b84a;--bg:#0a0c12;--bg2:#12151f;--tx:#eef0f6;--mu:#8b93ad;--bd:rgba(255,255,255,.1)}
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
.w{max-width:480px;margin:0 auto;padding:18px 16px 40px;text-align:center}
.badge{display:inline-block;border:1px solid var(--bd);color:var(--mu);padding:5px 12px;border-radius:99px;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}
h1{font-size:24px;line-height:1.2;margin:14px 0 6px}h1 span{color:var(--c)}
.sub{color:var(--mu);font-size:15px;line-height:1.45;margin-bottom:14px}
.tabs{display:flex;gap:8px;margin:0 0 12px}
.tabs button{flex:1;padding:11px 6px;border-radius:12px;border:1px solid var(--bd);background:var(--bg2);color:var(--mu);font-weight:800;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--c);color:#111;border-color:var(--c)}
video{width:100%;max-height:72vh;border-radius:16px;background:#000;border:1px solid var(--bd)}
.desc{color:var(--mu);font-size:14px;line-height:1.45;margin:10px 0 4px;min-height:40px}
.btn{display:block;text-decoration:none;font-weight:800;font-size:17px;padding:15px 18px;border-radius:14px;margin:10px 0;border:2px solid var(--c)}
.pri{background:var(--c);color:#111}.wa{background:#25D366;border-color:#25D366;color:#fff}
.nota{color:var(--mu);font-size:12px;margin-top:14px;line-height:1.4}
</style></head><body><div class="w">
<span class="badge">RavenTechs</span>
<h1>Mirá cómo se usa <span id="nom">la app</span></h1>
<p class="sub">Son un par de minutos. Se ve cómo pasás del cuaderno a tu celular.</p>
<div class="tabs"><button id="tb" onclick="ver('basica')">Básica con sucursales</button><button id="tc" onclick="ver('completa')">Completa</button></div>
<video id="vid" controls playsinline preload="metadata"></video>
<p class="desc" id="desc"></p>
<a class="btn pri" id="probar" href="#">🎁 Probala gratis 14 días</a>
<a class="btn wa" id="wa" href="#" target="_blank" rel="noopener">💬 Tengo una consulta</a>
<p class="nota">Las pantallas del video son un ejemplo con datos inventados.</p>
</div>
<script>
// id de app -> [nombre, rubro del video]
var APPS={carnear:['CarneAR','carne'],pizzar:['PizzAR','pizza'],panar:['PanAR','pan'],puntoventa:['PuntoVenta','pv'],lavar:['lavAR','lav'],barbear:['BarbeAR','barbe']};
var q=new URLSearchParams(location.search),id=(q.get('app')||'carnear').toLowerCase(),ref=q.get('ref')||'';
var a=APPS[id]||APPS.carnear; if(!APPS[id]) id='carnear';
var DESC={basica:'Versión Básica con sucursales: el dueño ve sus dos locales, un cobro en caja, el histórico de ventas y el resumen por WhatsApp.',completa:'Versión Completa: todo lo anterior más la carga de un gasto y el control de stock.'};
function $(i){return document.getElementById(i)}
function ver(v){
  if(v!=='completa') v='basica';
  var vd=$('vid'); vd.src='RavenTechs-'+a[1]+'-'+v+'.mp4'; vd.load();
  $('tb').className=v==='basica'?'on':''; $('tc').className=v==='completa'?'on':''; $('desc').textContent=DESC[v];
  try{history.replaceState(null,'','?app='+id+'&v='+v+(ref?'&ref='+encodeURIComponent(ref):''))}catch(e){}
}
$('nom').textContent=a[0]; document.title='Mirá cómo funciona '+a[0]+' — RavenTechs';
$('probar').href='https://ventas.raventechsapp.com/probar/?app='+id+(ref?'&ref='+encodeURIComponent(ref):'');
$('wa').href='https://wa.me/5491136547592?text='+encodeURIComponent('Hola! Vi el video de '+a[0]+' y quiero consultar.'+(ref?' (código '+ref+')':''));
ver(q.get('v'));
</script></body></html>
